services:
  wylzsmg3m4:
    container_name: wylzsmg3m4_app
    image: ghcr.io/mr-devloper005/safehavenannuity.com:latest
    env_file:
      - .env
    network_mode: bridge
    restart: always
    ports:
      - "127.0.0.1:3258:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5m
      timeout: 3s
      retries: 2
